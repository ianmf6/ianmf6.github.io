<!-- start custom head snippets -->

<!-- insert favicons. use https://realfavicongenerator.net/ -->
<link rel="apple-touch-icon" sizes="76x76" href="/assets/icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png?v=2">
<link rel="manifest" href="/assets/icons/site.webmanifest">
<link rel="mask-icon" href="/assets/icons/safari-pinned-tab.svg" color="#5bbad5">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="theme-color" content="#ffffff">

<!-- Twitter/X large-image card — emitted only for pages that set a
     header.og_image (e.g. the app landing page). The theme gates its own
     twitter tags behind a Twitter handle we don't have, and og:image
     alone doesn't give X a large card without twitter:card. -->
{% if page.header.og_image %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
<meta name="twitter:image" content="{{ page.header.og_image | absolute_url }}">
{% endif %}

<!-- end custom head snippets -->
