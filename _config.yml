# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: IanM.tech
repository: ianmf6/ianmf6
email:
description: >- # this means to ignore newlines until "baseurl:"
  Ian Marrero — cybersecurity engineer (CISSP, GIAC GCIH) and Army veteran. Notes on detection engineering, incident response, HackTheBox writeups, and the VA Compensation Calculator iOS app.
# twitter_username: username
github_username: ianmf6
minimal_mistakes_skin: ianm
search: true
url: https://www.ianm.tech
logo: "/assets/images/logo.png" # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"

# Build settings
encoding: utf-8
markdown: kramdown
# Pinned to a released tag so an upstream push to the theme's master can't
# change markup/CSS or break the hand-written carousel between deploys.
# MAINTENANCE: each time you update site content, check for a newer
# Minimal Mistakes release (github.com/mmistakes/minimal-mistakes/releases),
# bump this tag deliberately, and verify the project page still renders.
remote_theme: mmistakes/minimal-mistakes@4.28.0
#theme: minimal-mistakes-jekyll
# Outputting
permalink: /:year/:month/:title/
timezone: EST # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-redirect-from

# Drives the Person JSON-LD that Jekyll-SEO emits on every page.
# Without this block, Jekyll-SEO emits "name": null in the schema.org
# Person object, which Google Search Console flags as an invalid entity.
social:
  type: "Person"
  name: "Ian Marrero"
  links:
    - "https://www.linkedin.com/in/ianmarrero/"

author:
  name   : "Ian Marrero"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Cybersecurity Engineer — CISSP, GIAC GCIH. Army veteran. Building the VA Compensation Calculator iOS app."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ianmarrero/"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://facebook.com/ian.marrero"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/ian.marrero"


footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ianmarrero/"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://facebook.com/ian.marrero"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/ian.marrero"
  

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: #false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

#comments:
#  provider: "disqus"
#  disqus:
#    shortname: "ianmf6"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

