# Per-app facts that change when an app ships.
#
# WHY THIS FILE EXISTS: the App Store ID isn't known until Apple approves the
# app, and it's needed in several places (project page badge, JSON-LD
# downloadUrl, the Projects index). Keeping it here means going live is ONE
# edit — fill in app_store_id, set status to "Released" — and every page
# switches from "coming soon" to real download links on the next build.
#
# Reminder: the app itself also carries the ID (AboutView.swift's
# appStoreURL) — filled in the app repo Aug 13, 2026, with this same ID.

mediaharbor:
  name: "MediaHarbor"
  status: "Released"
  # Numeric Apple ID (live since the 1.0.0 approval).
  app_store_id: "6792407366"
  # App Store URL slug (the human-readable part before /id######).
  app_store_slug: "mediaharbor"
